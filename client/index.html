<!doctype html>
<html lang="en" class="dark-coc-coc">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora - Learning Platform</title>
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light") {
          document.documentElement.classList.remove("dark-coc-coc");
        } else {
          document.documentElement.classList.add("dark-coc-coc");
          if (!savedTheme) localStorage.setItem("theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; background:#fff8f3; font-family:system-ui, -apple-system, sans-serif;">
        <div style="width:44px; height:44px; border:3.5px solid rgba(249,115,22,0.18); border-top-color:#f97316; border-radius:50%; animation:app-spin 0.8s linear infinite;"></div>
        <p style="margin-top:14px; font-size:12px; font-weight:800; color:#ea580c; letter-spacing:1.5px; text-transform:uppercase;">Nexora LMS</p>
        <style>@keyframes app-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
