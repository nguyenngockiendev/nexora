<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Nền Gradient Cam Hổ Phách cao cấp -->
    <linearGradient id="nx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <!-- Bóng đổ nhẹ nhàng -->
    <filter id="nx-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Khung icon vuông bo góc mềm mại -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#nx-bg)" filter="url(#nx-shadow)" />

  <!-- Chữ N hình học màu trắng tinh khôi và sắc nét -->
  <path 
    d="M 32 30 
       L 42 30 
       L 58 56 
       L 58 30 
       L 68 30 
       L 68 70 
       L 58 70 
       L 42 44 
       L 42 70 
       L 32 70 Z" 
    fill="#ffffff" 
  />
</svg>